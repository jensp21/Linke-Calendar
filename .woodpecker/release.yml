when:
  - event: tag
    ref: refs/tags/[0-9]*.[0-9]*.[0-9]*

variables:
  - &step_resources
    backend_options:
      kubernetes:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 1Gi

steps:
  - name: build-and-push-image
    image: woodpeckerci/plugin-docker-buildx
    <<: *step_resources
    settings:
      registry:
        from_secret: registry_url
      repo:
        from_secret: container_image_repo
      tags:
        - ${CI_COMMIT_TAG}
        - latest
      username:
        from_secret: registry_username
      password:
        from_secret: registry_token
      build_args:
        VERSION: ${CI_COMMIT_TAG}

  - name: package-and-push-chart
    image: alpine/helm:3.16.2
    <<: *step_resources
    environment:
      REGISTRY_URL:
        from_secret: registry_url
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_TOKEN:
        from_secret: registry_token
    commands:
      - echo "$REGISTRY_TOKEN" | helm registry login "$REGISTRY_URL" --username "$REGISTRY_USERNAME" --password-stdin
      - helm package deploy/helm/linke-calendar --version "$CI_COMMIT_TAG" --app-version "$CI_COMMIT_TAG" --destination dist/
      - helm push "dist/linke-calendar-chart-${CI_COMMIT_TAG}.tgz" "oci://$REGISTRY_URL"
