image:
  repository: registry.apex.romanzipp.cloud/linke-calendar-image
  pullPolicy: IfNotPresent
  tag: ""

fullnameOverride: linke-calendar

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  groups: []

persistence:
  enabled: true
  storageClass: ""
  size: 1Gi
  accessMode: ReadWriteOnce
  mountPath: /app/data

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

config:
  scraper:
    max_pages: 10
    interval: "6h"
    timeout: "30s"
  server:
    port: "8080"
    host: "0.0.0.0"

probes:
  liveness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 2
    periodSeconds: 5
